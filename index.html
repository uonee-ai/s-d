<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>시장 가격 탐정 - 수요·공급 곡선 이동 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1420; --panel:#17202F; --panel2:#1E2A3D; --line:#2B3A52;
    --ink:#F2F0E9; --dim:#93A3BC;
    --demand:#FFA94D; --supply:#4DD4AC; --gold:#FFD166;
    --up:#FF6B6B; --down:#5C9DFF; --heart:#FF7EB6;
    --ok:#4DD4AC; --bad:#FF6B6B;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'IBM Plex Sans KR',sans-serif;
    min-height:100vh; display:flex; justify-content:center;
    background-image:radial-gradient(circle at 20% 0%, #16233A 0%, var(--bg) 55%);
  }
  .wrap{width:100%; max-width:860px; padding:16px 14px 40px;}
  h1,h2,.dh{font-family:'Do Hyeon',sans-serif; font-weight:400; letter-spacing:.02em;}

  /* ── 상단 전광판 ── */
  .board{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:10px 16px; margin-bottom:14px;
  }
  .board h1{font-size:1.25rem; color:var(--gold);}
  .board .stats{display:flex; gap:14px; font-size:.9rem; align-items:center;}
  .board .stats > *{margin-left:14px;}
  .board .stats > *:first-child{margin-left:0;}
  .board .stats b{font-family:'Do Hyeon'; font-size:1.1rem; color:var(--ink); margin-left:4px;}
  #hud-lives{margin-left:0; color:var(--heart);}
  #snd-btn{
    background:transparent; border:none; cursor:pointer; font-size:1.05rem;
    padding:0 0 0 4px; line-height:1; filter:grayscale(.2);
  }
  #snd-btn:hover{filter:none;}
  .streak-on{color:var(--gold);}
  #hud-lives{letter-spacing:0; color:var(--heart); font-size:1rem;}
  #hud-lives .star{margin-right:3px;}
  #hud-lives .hp{
    display:inline-block; margin:0 1px; color:var(--heart);
    transition:color .35s, transform .35s, opacity .35s;
  }
  #hud-lives .hp.gone{
    color:#2B3A52;                 /* 잃은 목숨: 검게 */
    opacity:.55; transform:scale(.82);
  }
  #hud-lives .hp.breaking{animation:breakheart .6s ease-out;}
  @keyframes breakheart{
    0%{transform:scale(1.5) rotate(0deg); color:#FF7EB6;}
    25%{transform:scale(1.6) rotate(-14deg);}
    50%{transform:scale(1.4) rotate(14deg); color:#FF6B6B;}
    100%{transform:scale(.82) rotate(0deg); color:#2B3A52;}
  }
  #hud-lives.low .hp:not(.gone){animation:heartbeat .7s infinite;}
  @keyframes heartbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
  .board .stats .ingame{display:none;}
  .board .stats .ingame.show{display:inline;}

  /* ── 제한 시간 바 ── */
  .timer-wrap{
    display:none; position:relative; height:16px; margin:-6px 0 14px;
    background:var(--panel2); border:1px solid var(--line); border-radius:99px; overflow:hidden;
  }
  .timer-wrap.show{display:block;}
  .timer-bar{
    height:100%; width:100%; border-radius:99px;
    background:linear-gradient(90deg,#4DD4AC,#8BE3C8);
    transition:width .1s linear, background .3s;
  }
  .timer-bar.warn{background:linear-gradient(90deg,#FFD166,#FFE39A);}
  .timer-bar.danger{background:linear-gradient(90deg,#FF6B6B,#FF9B9B);}
  .timer-num{
    position:absolute; right:10px; top:0; line-height:16px;
    font-family:'Do Hyeon'; font-size:.75rem; color:var(--bg);
  }
  .shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .flash-bad{animation:flashbad .5s;}
  @keyframes flashbad{0%,100%{background:var(--panel)}50%{background:rgba(255,107,107,.28)}}

  /* ── 제한 시간 선택 ── */
  .speed-pick{margin:0 auto 20px; max-width:560px;}
  .sp-label{font-family:'Do Hyeon'; color:var(--dim); font-size:.9rem; margin-bottom:8px;}
  .sp-btns{display:flex; gap:8px; justify-content:center;}
  .sp-btn{
    flex:1; max-width:150px; cursor:pointer; font-family:'Do Hyeon'; font-size:1rem;
    background:var(--panel2); color:var(--dim);
    border:2px solid var(--line); border-radius:10px; padding:8px;
  }
  .sp-btn small{display:block; font-family:'IBM Plex Sans KR'; font-size:.75rem; margin-top:2px;}
  .sp-btn.active{border-color:var(--gold); color:var(--gold); background:rgba(255,209,102,.1);}
  .sp-info{margin-top:8px; font-size:.85rem; color:var(--gold); font-family:'IBM Plex Sans KR';}
  .rules .tag.warn{background:var(--up); color:#fff;}
  .rules .tag.heal{background:var(--ok); color:var(--bg);}
  .heart{color:var(--heart);}
  .rules .pt{display:inline-block; font-family:'Do Hyeon'; font-size:.8rem;
    color:var(--gold); border:1px solid var(--gold); border-radius:5px; padding:0 6px; margin-left:4px;}
  .timeup-msg{color:var(--bad); font-family:'Do Hyeon';}

  .screen{display:none;} .screen.active{display:block;}

  /* ── 시작 화면 ── */
  .hero{
    background:var(--panel); border:1px solid var(--line); border-radius:18px;
    padding:34px 24px; text-align:center;
  }
  .hero h2{font-size:2rem; color:var(--gold); margin-bottom:6px;}
  .hero .sub{color:var(--dim); margin-bottom:22px; line-height:1.6; font-size:.95rem;}
  .rules{
    display:inline-block; text-align:left;
    background:var(--panel2); border-radius:12px;
    padding:16px 22px; margin:0 auto 24px; max-width:560px;
    font-size:.95rem; line-height:2.0; color:var(--ink);
  }
  .rules .tag{display:inline-block; font-family:'Do Hyeon'; color:var(--bg);
    background:var(--gold); border-radius:6px; padding:0 8px; margin-right:10px; font-size:.85rem;
    min-width:4.4em; text-align:center;}
  .mode-btns{display:flex; gap:12px; justify-content:center; align-items:stretch;
    max-width:460px; margin:0 auto;}
  .mode-btn{
    flex:1 1 0; min-width:0;              /* 두 버튼의 폭을 똑같이 */
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'Do Hyeon'; font-size:1.2rem; cursor:pointer;
    background:var(--panel2); color:var(--ink);
    border:2px solid var(--line); border-radius:14px; padding:18px 12px;
    transition:transform .12s, border-color .12s;
  }
  .mode-btn small{display:block; font-family:'IBM Plex Sans KR'; font-size:.8rem;
    color:var(--dim); margin-top:6px; line-height:1.45;}
  .mode-btn:hover{transform:translateY(-2px);}
  .mode-btn.basic{border-color:var(--supply);}
  .mode-btn.hard{border-color:var(--demand);}

  /* ── 게임 화면 ── */
  .scenario{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; margin-bottom:12px;
  }
  .scenario .market{
    display:inline-block; font-family:'Do Hyeon'; font-size:.9rem;
    color:var(--bg); background:var(--gold); border-radius:6px; padding:1px 10px; margin-bottom:8px;
  }
  .scenario p{font-size:1.02rem; line-height:1.65;}
  .qnum{color:var(--dim); font-size:.82rem; float:right;}

  .stage{
    display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px; align-items:start;
  }
  @media(max-width:680px){ .stage{grid-template-columns:1fr;} }

  .graph-card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px;
  }
  svg{width:100%; height:auto; display:block;}
  .shiftable{transition:transform 1s cubic-bezier(.4,0,.2,1);}
  .fade{transition:opacity .5s;}

  .qa-card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 14px 16px;
  }
  .qa-card .qtitle{font-family:'Do Hyeon'; font-size:1.05rem; margin-bottom:10px; color:var(--gold);}
  .opts{display:grid; gap:8px;}
  .opt{
    text-align:left; cursor:pointer; font-family:'IBM Plex Sans KR'; font-size:.95rem;
    background:var(--panel2); color:var(--ink);
    border:2px solid var(--line); border-radius:10px; padding:11px 13px;
    transition:border-color .12s, background .12s;
  }
  .opt:hover{border-color:var(--dim);}
  .opt:disabled{cursor:default; opacity:.85;}
  .opt.correct{border-color:var(--ok); background:rgba(77,212,172,.13);}
  .opt.wrong{border-color:var(--bad); background:rgba(255,107,107,.13);}
  .opt .arrow{font-family:'Do Hyeon'; margin-right:6px;}
  .opt .arrow.d{color:var(--demand);} .opt .arrow.s{color:var(--supply);}
  .bigab{font-family:'Do Hyeon'; font-size:1.35em; font-weight:700; letter-spacing:.02em;}
  .opt .optno{display:inline-block; min-width:18px; height:18px; line-height:18px; text-align:center;
    background:var(--line); color:var(--dim); border-radius:5px; font-size:.75rem;
    font-family:'Do Hyeon'; margin-right:6px;}

  .feedback{
    margin-top:12px; border-radius:10px; padding:11px 13px;
    font-size:.9rem; line-height:1.65; display:none;
  }
  .feedback.show{display:block;}
  .feedback.good{background:rgba(77,212,172,.12); border:1px solid var(--ok);}
  .feedback.miss{background:rgba(255,107,107,.1); border:1px solid var(--bad);}
  .feedback .fb-title{font-family:'Do Hyeon'; margin-bottom:4px;}
  .feedback .factor{display:inline-block; margin-top:6px; font-size:.8rem; color:var(--bg);
    background:var(--dim); border-radius:6px; padding:1px 8px;}

  .next-btn{
    display:none; margin-top:12px; width:100%;
    font-family:'Do Hyeon'; font-size:1.1rem; cursor:pointer;
    background:var(--gold); color:#1a1408; border:none; border-radius:10px; padding:12px;
  }
  .next-btn.show{display:block;}
  .retry-btn{
    display:none; margin-top:8px; width:100%;
    font-family:'Do Hyeon'; font-size:.95rem; cursor:pointer;
    background:transparent; color:var(--dim);
    border:2px dashed var(--line); border-radius:10px; padding:9px;
    transition:color .12s, border-color .12s;
  }
  .retry-btn:hover{color:var(--gold); border-color:var(--gold);}
  .retry-btn.show{display:block;}

  .result-badges{display:none; gap:10px; margin-top:10px; justify-content:center;}
  .result-badges.show{display:flex;}
  .badge{
    font-family:'Do Hyeon'; font-size:1rem; border-radius:10px; padding:8px 16px;
    background:var(--panel2); border:1px solid var(--line);
  }
  .badge.up{color:var(--up); border-color:var(--up);}
  .badge.down{color:var(--down); border-color:var(--down);}

  /* ── 결과 화면 ── */
  .final{
    background:var(--panel); border:1px solid var(--line); border-radius:18px;
    padding:34px 22px; text-align:center;
  }
  .final .title{font-family:'Do Hyeon'; font-size:2rem; color:var(--gold); margin:8px 0 2px;}
  .final .score{font-family:'Do Hyeon'; font-size:3.2rem;}
  .final .of{color:var(--dim); font-size:1rem;}
  .final .msg{color:var(--dim); margin:10px 0 20px; line-height:1.7; font-size:.95rem;}
  .review{
    text-align:left; max-width:600px; margin:0 auto 22px;
    background:var(--panel2); border-radius:12px; padding:14px 16px;
    font-size:.88rem; line-height:1.7; max-height:260px; overflow-y:auto;
  }
  .review .rv{padding:6px 0; border-bottom:1px dashed var(--line);}
  .review .rv:last-child{border-bottom:none;}
  .review .ok{color:var(--ok); font-family:'Do Hyeon'; margin-right:6px;}
  .review .no{color:var(--bad); font-family:'Do Hyeon'; margin-right:6px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="board">
    <h1>📈 시장 가격 탐정</h1>
    <div class="stats">
      <span class="ingame">문제<b id="hud-round">-</b></span>
      <span class="ingame">점수<b id="hud-score">0</b></span>
      <span class="ingame">연속<b id="hud-streak">0</b></span>
      <span class="ingame" id="hud-lives-wrap"><b id="hud-lives"></b></span>
      <button id="snd-btn" onclick="toggleSound()" title="소리 끄기">🔊</button>
    </div>
  </div>

  <!-- 제한 시간 바 -->
  <div class="timer-wrap" id="timer-wrap">
    <div class="timer-bar" id="timer-bar"></div>
    <span class="timer-num" id="timer-num">20</span>
  </div>

  <!-- 시작 화면 -->
  <section class="screen active" id="scr-start">
    <div class="hero">
      <h2>수요·공급 곡선 이동 게임</h2>
      <p class="sub">사례를 읽고, 곡선의 이동과 가격 변화를 추리하라!</p>
      <div class="rules">
        <div><span class="tag">1단계</span><b>변동 요인</b> 찾기! <span class="pt">+10</span></div>
        <div><span class="tag">2단계</span><b>곡선 이동</b> 맞히기! <span class="pt">+10</span></div>
        <div><span class="tag">3단계</span><b>가격·거래량</b> 예측하기! <span class="pt">+10</span></div>
        <div><span class="tag">보너스</span>세 단계 모두 정답! <span class="pt">+5</span></div>
        <div><span class="tag warn">목숨</span><span class="heart">❤</span> 7개 — 틀리거나 시간 초과하면 -1, 다 잃으면 <b>게임 오버!</b></div>
        <div><span class="tag heal">회복</span>2문제 연속 완벽하면 목숨 <span class="heart">+1 ❤</span></div>
      </div>

      <div class="speed-pick">
        <div class="sp-label">⏱ 제한 시간 — 짧을수록 점수 배율 UP!</div>
        <div class="sp-btns">
          <button class="sp-btn" data-sec="30" onclick="pickSpeed(this,30)">여유<small>30초 · ×0.8</small></button>
          <button class="sp-btn active" data-sec="20" onclick="pickSpeed(this,20)">보통<small>20초 · ×1.0</small></button>
          <button class="sp-btn" data-sec="12" onclick="pickSpeed(this,12)">도전<small>12초 · ×1.2</small></button>
        </div>
        <div class="sp-info" id="sp-info">선택: <b>보통</b> · 점수 배율 <b>×1.0</b> · 만점 <b>525점</b></div>
      </div>
      <div class="mode-btns">
        <button class="mode-btn basic" onclick="startGame('basic')">기본 모드<small>곡선 이름 보임<br>15문제</small></button>
        <button class="mode-btn hard" onclick="startGame('hard')">심화 모드<small>곡선 이름 숨김 + 함정<br>15문제</small></button>
      </div>
    </div>
  </section>

  <!-- 게임 화면 -->
  <section class="screen" id="scr-game">
    <div class="scenario">
      <span class="qnum" id="qnum"></span>
      <span class="market" id="market"></span>
      <p id="scenario-text"></p>
    </div>
    <div class="stage">
      <div class="graph-card">
        <svg id="graph" viewBox="0 0 420 330" xmlns="http://www.w3.org/2000/svg" aria-label="수요 공급 그래프">
          <defs>
            <clipPath id="plot-area"><rect x="55" y="15" width="330" height="270"/></clipPath>
          </defs>
          <!-- 축 -->
          <line x1="55" y1="285" x2="385" y2="285" stroke="#93A3BC" stroke-width="2"/>
          <line x1="55" y1="285" x2="55" y2="15" stroke="#93A3BC" stroke-width="2"/>
          <polygon points="385,285 376,280 376,290" fill="#93A3BC"/>
          <polygon points="55,15 50,24 60,24" fill="#93A3BC"/>
          <text x="40" y="30" fill="#93A3BC" font-size="20" font-weight="bold" font-family="IBM Plex Sans KR" text-anchor="middle">P</text>
          <text x="382" y="310" fill="#93A3BC" font-size="20" font-weight="bold" font-family="IBM Plex Sans KR" text-anchor="middle">Q</text>
          <!-- 가이드 라인 (결과 표시용) -->
          <g id="guides" class="fade" opacity="0">
            <line id="g-p0h" stroke="#93A3BC" stroke-width="1" stroke-dasharray="3 4"/>
            <line id="g-q0v" stroke="#93A3BC" stroke-width="1" stroke-dasharray="3 4"/>
            <line id="g-p1h" stroke="#FFD166" stroke-width="1" stroke-dasharray="3 4"/>
            <line id="g-q1v" stroke="#FFD166" stroke-width="1" stroke-dasharray="3 4"/>
            <text id="g-p0t" fill="#93A3BC" font-size="12" text-anchor="end">P₀</text>
            <text id="g-p1t" fill="#FFD166" font-size="12" text-anchor="end">P₁</text>
            <text id="g-q0t" fill="#93A3BC" font-size="12" text-anchor="middle">Q₀</text>
            <text id="g-q1t" fill="#FFD166" font-size="12" text-anchor="middle">Q₁</text>
          </g>
          <!-- 원래 곡선의 잔상 -->
          <line id="ghost" class="fade" opacity="0" stroke-width="2" stroke-dasharray="6 6"/>
          <!-- 곡선 (고정된 바깥 그룹에 클리핑 → 이동해도 축을 넘지 않음) -->
          <g clip-path="url(#plot-area)">
            <g id="demand-g" class="shiftable">
              <line x1="80" y1="70" x2="320" y2="250" stroke="#FFA94D" stroke-width="3.5" stroke-linecap="round"/>
            </g>
            <g id="supply-g" class="shiftable">
              <line x1="80" y1="250" x2="320" y2="70" stroke="#4DD4AC" stroke-width="3.5" stroke-linecap="round"/>
            </g>
          </g>
          <!-- 곡선 이름표 (곡선을 따라 이동) -->
          <text id="d-label" class="shiftable" x="320" y="270" text-anchor="middle" fill="#FFA94D" font-size="15" font-family="Do Hyeon">수요 D</text>
          <text id="s-label" class="shiftable" x="320" y="60" text-anchor="middle" fill="#4DD4AC" font-size="15" font-family="Do Hyeon">공급 S</text>
          <!-- 균형점 -->
          <circle id="e0" cx="200" cy="160" r="6" fill="#FFD166"/>
          <text id="e0t" x="210" y="152" fill="#FFD166" font-size="13" font-family="Do Hyeon">E₀</text>
          <circle id="e1" class="fade" opacity="0" r="6" fill="#FFD166" stroke="#0E1420" stroke-width="1.5"/>
          <text id="e1t" class="fade" opacity="0" fill="#FFD166" font-size="13" font-family="Do Hyeon">E₁</text>
        </svg>
        <div class="result-badges" id="badges">
          <span class="badge" id="badge-p"></span>
          <span class="badge" id="badge-q"></span>
        </div>
      </div>
      <div class="qa-card">
        <div class="qtitle" id="qtitle"></div>
        <div class="opts" id="opts"></div>
        <div class="feedback" id="feedback"></div>
        <button class="next-btn" id="next-btn" onclick="nextStep()">다음 ▶</button>
        <button class="retry-btn" id="retry-btn" onclick="restartRun()">↺ 처음부터 다시하기 (무실점 도전)</button>
      </div>
    </div>
  </section>

  <!-- 결과 화면 -->
  <section class="screen" id="scr-end">
    <div class="final">
      <div class="dh" style="font-size:1rem;color:var(--dim)">최종 결과</div>
      <div class="title" id="final-title"></div>
      <div><span class="score" id="final-score"></span><span class="of" id="final-max"> 점</span></div>
      <p class="msg" id="final-msg"></p>
      <div class="review" id="review"></div>
      <div class="mode-btns">
        <button class="mode-btn basic" onclick="location.reload()">처음으로</button>
      </div>
    </div>
  </section>

</div>
<script>

/* ─────────── 사운드 (Web Audio API로 직접 합성 — 외부 파일 불필요) ─────────── */
let AC=null, soundOn=true;
function ac(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
/* 단순 음 하나 */
function beep(freq, dur, type='sine', vol=0.18, delay=0){
  if(!soundOn) return;
  const c=ac(); if(!c) return;
  const t=c.currentTime+delay;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t+dur+0.02);
}
/* 주파수가 미끄러지는 음 */
function slide(f1, f2, dur, type='sawtooth', vol=0.15, delay=0){
  if(!soundOn) return;
  const c=ac(); if(!c) return;
  const t=c.currentTime+delay;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f1,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(40,f2),t+dur);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t+dur+0.02);
}

/* ─────────── 그래프 좌표 계산 ───────────
   화면 좌표: D는 y=0.75x+10, S는 y=-0.75x+310, 초기 균형 (200,160), 이동폭 dx=60 */
const DX = 60;
function newEq(curve, dir){
  const dx = (dir==='R'? DX : -DX);
  const x = 200 + 0.5*dx;
  const y = (curve==='D') ? 160 - 0.375*dx : 160 + 0.375*dx;
  return {x, y, dx};
}

/* ─────────── 게임 상태 ─────────── */
const ROUNDS = 15;
let deck=[], round=0, score=0, streak=0, phase=1, cur=null, fok=false, sok=false, log=[];

/* ── 아케이드 요소: 제한 시간 · 목숨 ── */
const MAXLIVES = 7;
let lives=MAXLIVES, baseSec=20, timerId=null, timeLeft=0, timeTotal=0, dead=false, lostThisRound=false, flawless=true;
/* 제한 시간이 짧을수록 어려우므로 최종 점수에 배율을 적용 */
const MULT = {30:0.8, 20:1.0, 12:1.2};
const MULT_NAME = {30:'여유', 20:'보통', 12:'도전'};
/* 난이도별 등급 칭호 — 티어(정확도) + 수식어(난이도) */
const TIERS = [
  {t:'💎 다이아 상인', m:'곡선의 흐름을 완벽하게 읽어냈어요. 최고의 자리입니다!'},
  {t:'🥇 골드 상인',   m:'끝까지 살아남았어요. 틀린 단계만 짚으면 다이아가 보입니다.'},
  {t:'🥈 실버 상인',   m:'완주 성공! 변동 요인과 곡선을 잇는 감각이 붙고 있어요.'},
  {t:'🥉 브론즈 상인', m:'끝까지 버텼어요. 아래 오답을 확인하고 다시 도전해 봐요!'},
];
const PREFIX = {30:'', 20:'PRO ', 12:'MASTER '};
function rankOf(pct){
  const i = pct>=0.8 ? 0 : pct>=0.6 ? 1 : pct>=0.4 ? 2 : 3;
  const base = TIERS[i];
  const pre = PREFIX[baseSec] || '';
  // 이모지 뒤에 수식어를 넣는다 (예: 💎 MASTER 다이아 상인)
  const t = pre ? base.t.replace(/^(\S+)\s/, `$1 ${pre}`) : base.t;
  return {t, m:base.m};
}
function mult(){ return MULT[baseSec] || 1; }
const BASE_MAX = 525;              // 배율 1.0 기준 만점 (15문제 × 35점)
function maxScore(){ return Math.round(BASE_MAX * mult()); }
/* 점수는 배율 적용 전 원점수(raw)로 누적하고, 표시할 때 배율을 적용한다.
   이렇게 하면 단계마다 반올림 오차가 쌓이지 않아 만점이 정확히 떨어진다. */
function disp(raw){ return Math.round(raw * mult()); }
/* 화면에 보여줄 획득 점수 = 표시 총점의 실제 증가분 */
function gainShown(before, after){ return disp(after) - disp(before); }

function pickSpeed(btn, sec){
  baseSec = sec;
  document.querySelectorAll('.sp-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const info=document.getElementById('sp-info');
  if(info) info.innerHTML = `선택: <b>${MULT_NAME[sec]}</b> · 점수 배율 <b>×${mult().toFixed(1)}</b> · 만점 <b>${maxScore()}점</b>`;
}
function stageSec(){
  // 1·2단계는 기준 시간, 3단계는 계산이 짧아 80%
  return phase===3 ? Math.max(6, Math.round(baseSec*0.8)) : baseSec;
}
function startTimer(){
  stopTimer();
  timeTotal = stageSec(); timeLeft = timeTotal;
  const bar=document.getElementById('timer-bar'), num=document.getElementById('timer-num');
  document.getElementById('timer-wrap').classList.add('show');
  bar.className='timer-bar'; bar.style.width='100%'; num.textContent=timeTotal;
  timerId = setInterval(()=>{
    timeLeft -= 0.1;
    if(timeLeft<=0){ stopTimer(); timeUp(); return; }
    const pct = timeLeft/timeTotal*100;
    bar.style.width = pct+'%';
    num.textContent = Math.ceil(timeLeft);
    bar.className = 'timer-bar' + (timeLeft<=timeTotal*0.2?' danger':(timeLeft<=timeTotal*0.5?' warn':''));
    if(timeLeft<=3 && Math.abs(timeLeft-Math.round(timeLeft))<0.06){
      SFX.tick();
      document.querySelector('.qa-card').classList.remove('shake');
      void document.querySelector('.qa-card').offsetWidth;
      document.querySelector('.qa-card').classList.add('shake');
    }
  },100);
}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
function loseLife(){
  flawless = false;
  const card=document.querySelector('.qa-card');
  card.classList.remove('flash-bad'); void card.offsetWidth; card.classList.add('flash-bad');
  if(lostThisRound) return false;   // 한 문제에서는 목숨이 하나만 줄어든다
  lostThisRound = true;
  const lostIndex = lives-1;   // 방금 꺼질 하트의 위치
  lives--;
  hud();
  const hearts=document.querySelectorAll('#hud-lives .hp');
  if(hearts[lostIndex]) hearts[lostIndex].classList.add('breaking');
  if(lives<=0){ dead=true; }
  return true;
}
function timeUp(){
  // 시간 초과 = 오답 처리
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  revealCorrect();
  if(phase===1) fok=false; else if(phase===2) sok=false;
  SFX.timeup();
  streak=0; const lostTU=loseLife();
  logMark(false);
  const fb=document.getElementById('feedback');
  fb.className='feedback show miss';
  fb.innerHTML=`<div class="fb-title timeup-msg">⏰ 시간 초과!${lostTU?' 목숨 -1':''}</div>${phase===3?Q2WHY[q2Key()]:cur.why}`;
  if(phase===2) animateShift();
  if(phase===3) showResultOnGraph(q2Key());
  showNext();
}
function logMark(ok){
  const key = phase===1?'f':(phase===2?'s':'p');
  if(phase===1) log.push({round:round+1, market:cur.market, f:ok});
  else if(log.length) log[log.length-1][key]=ok;
}
function revealCorrect(){
  // 현재 단계의 정답 선택지를 표시
  if(phase===1){
    const ck=fcatOf(cur);
    document.querySelectorAll('.opt').forEach(b=>{ if(b.textContent.includes(FCATS[ck])) b.classList.add('correct'); });
  }else if(phase===2){
    const correctKey = cur.curve==='N' ? 'N' : cur.curve+'-'+cur.dir;
    document.querySelectorAll('.opt').forEach(b=>{
      const t=b.innerHTML;
      if((correctKey==='N' && t.includes('이동하지 않는다')) ||
         (correctKey!=='N' && matchOpt(t, correctKey))) b.classList.add('correct');
    });
  }else{
    const ck=q2Key();
    document.querySelectorAll('.opt').forEach(b=>{ if(optKeyOf(b)===ck) b.classList.add('correct'); });
  }
}
/* 같은 모드·같은 난이도로 처음부터 다시 시작 (무실점 도전용) */
function restartRun(){
  stopTimer();
  startGame(window.MODE);
}
function showNext(){
  const nb=document.getElementById('next-btn');
  // 이번 문제에서 한 번이라도 틀렸다면 '처음부터 다시하기'를 함께 보여준다
  const rb=document.getElementById('retry-btn');
  rb.classList.toggle('show', lostThisRound && !dead);
  if(dead){ nb.textContent='💀 게임 오버 확인 ▶'; }
  else if(phase===1){ nb.textContent='2단계로 ▶'; }
  else if(phase===2 && cur.curve!=='N'){ nb.textContent='3단계로 ▶'; }
  else { nb.textContent = (round===ROUNDS-1)?'결과 보기 ▶':'다음 문제 ▶'; }
  nb.classList.add('show');
}

/* ─────────── 1단계: 변동 요인 분류 ─────────── */
const FCATS = {
  fTaste :'소비자의 기호(선호) 변화',
  fIncome:'소비자의 소득 변화',
  fSub   :'대체재의 가격 변화',
  fComp  :'보완재의 가격 변화',
  fExpD  :'소비자의 미래 가격 예상',
  fPop   :'수요자(인구) 수의 변화',
  fInput :'생산 요소(원자재·임금) 가격의 변화',
  fTech  :'생산 기술의 변화',
  fProd  :'공급자 수의 변화',
  fExpS  :'판매자의 미래 가격 예상',
  fNature:'기후·자연재해 등 생산 여건의 변화',
  fPrice :'그 상품 자체의 가격 변화',
};
function fcatOf(sc){
  const f=sc.factor;
  if(f.includes('량의 변화')) return 'fPrice';
  if(f.includes('기호'))   return 'fTaste';
  if(f.includes('소득'))   return 'fIncome';
  if(f.includes('대체재')) return 'fSub';
  if(f.includes('보완재')) return 'fComp';
  if(f.includes('미래'))   return sc.curve==='D' ? 'fExpD' : 'fExpS';
  if(f.includes('수요자')) return 'fPop';
  if(f.includes('원자재')||f.includes('임금')) return 'fInput';
  if(f.includes('기술'))   return 'fTech';
  if(f.includes('공급자')) return 'fProd';
  return 'fNature';
}
/* 심화 모드: 곡선 이름을 A·B으로 숨기고 매 문제 무작위 배정 */
let LB=null; // 예: {D:'A', S:'B'}
const COL={'A':'#D9A5FF','B':'#7ED0FF'};
function setupCurveStyle(){
  const dLine=document.querySelector('#demand-g line'), dTxt=document.getElementById('d-label');
  const sLine=document.querySelector('#supply-g line'), sTxt=document.getElementById('s-label');
  if(window.MODE==='hard'){
    LB = Math.random()<0.5 ? {D:'A',S:'B'} : {D:'B',S:'A'};
    // A·B는 한 글자뿐이라 크게 키워서 멀리서도 보이게 한다
    dLine.setAttribute('stroke',COL[LB.D]); dTxt.setAttribute('fill',COL[LB.D]);
    dTxt.textContent=LB.D; dTxt.setAttribute('font-size','30'); dTxt.setAttribute('font-weight','bold');
    dTxt.setAttribute('x','338'); dTxt.setAttribute('y','272');
    sLine.setAttribute('stroke',COL[LB.S]); sTxt.setAttribute('fill',COL[LB.S]);
    sTxt.textContent=LB.S; sTxt.setAttribute('font-size','30'); sTxt.setAttribute('font-weight','bold');
    sTxt.setAttribute('x','338'); sTxt.setAttribute('y','62');
  }else{
    LB=null;
    dLine.setAttribute('stroke','#FFA94D'); dTxt.setAttribute('fill','#FFA94D');
    dTxt.textContent='수요 D'; dTxt.setAttribute('font-size','15'); dTxt.setAttribute('font-weight','normal');
    dTxt.setAttribute('x','320'); dTxt.setAttribute('y','270');
    sLine.setAttribute('stroke','#4DD4AC'); sTxt.setAttribute('fill','#4DD4AC');
    sTxt.textContent='공급 S'; sTxt.setAttribute('font-size','15'); sTxt.setAttribute('font-weight','normal');
    sTxt.setAttribute('x','320'); sTxt.setAttribute('y','60');
  }
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function startGame(mode){
  let pool;
  if(mode==='hard'){
    // 함정 4문제 보장 + 심화 전용 사례 11문제
    pool = shuffle([...shuffle([...TRAPS]).slice(0,4), ...shuffle([...SCENARIOS_HARD]).slice(0,11)]);
  }else{
    pool = shuffle([...SCENARIOS_BASIC]);
  }
  deck = pool; window.MODE = mode;
  round=0; score=0; streak=0; log=[]; lives=MAXLIVES; dead=false; lostThisRound=false; flawless=true;
  document.querySelectorAll('.board .stats .ingame').forEach(el=>el.classList.add('show'));
  SFX.start();
  document.getElementById('scr-start').classList.remove('active');
  document.getElementById('scr-game').classList.add('active');
  loadRound();
}

function hud(){
  document.getElementById('hud-round').textContent = round+1 + '/' + ROUNDS;
  document.getElementById('hud-score').textContent = disp(score);
  const st = document.getElementById('hud-streak');
  st.textContent = streak + (streak>=3?'🔥':'');
  st.classList.toggle('streak-on', streak>=3);
  const lv=document.getElementById('hud-lives');
  const alive = Math.max(0, lives);
  let html = (flawless && round>0) ? '<span class="star">🌟</span>' : '';
  for(let i=0;i<MAXLIVES;i++){
    // 남은 목숨은 핑크, 잃은 목숨은 검게 (사라지는 연출은 CSS가 담당)
    html += `<span class="hp${i<alive?'':' gone'}">❤</span>`;
  }
  lv.innerHTML = html;
  lv.classList.toggle('low', lives<=2);
}

function resetGraph(){
  const els = ['demand-g','supply-g','d-label','s-label'].map(id=>document.getElementById(id));
  els.forEach(el=>{ el.style.transition='none'; el.style.transform='translateX(0)'; });
  void els[0].offsetWidth; // reflow
  els.forEach(el=>{ el.style.transition=''; });
  ['ghost','e1','e1t','guides'].forEach(id=>document.getElementById(id).setAttribute('opacity','0'));
  document.getElementById('badges').classList.remove('show');
}

function loadRound(){
  phase=1; fok=false; sok=false; lostThisRound=false; cur=deck[round];
  hud(); resetGraph(); setupCurveStyle();
  document.getElementById('qnum').textContent = `문제 ${round+1} / ${ROUNDS}`;
  document.getElementById('market').textContent = cur.market;
  document.getElementById('scenario-text').textContent = cur.text;
  document.getElementById('feedback').className='feedback';
  document.getElementById('next-btn').classList.remove('show');
  document.getElementById('retry-btn').classList.remove('show');
  renderF();
}

/* ─── 1단계: 요인 찾기 ─── */
function renderF(){
  phase=1;
  document.getElementById('qtitle').textContent='1단계 · 무엇이 시장을 흔들었을까? (변동 요인)';
  const ck = fcatOf(cur);
  let pool = Object.keys(FCATS).filter(k=>k!==ck);
  if(window.MODE!=='hard') pool = pool.filter(k=>k!=='fPrice'); // 기본 모드엔 함정 개념 제외
  let distractors;
  if(ck==='fSub' || ck==='fComp'){
    // 대체재·보완재가 정답이면 반드시 둘 다 선택지에 등장
    const pair = ck==='fSub' ? 'fComp' : 'fSub';
    distractors = [pair, ...shuffle(pool.filter(k=>k!==pair)).slice(0,2)];
  }else{
    distractors = shuffle(pool).slice(0,3);
  }
  const opts = shuffle([ck, ...distractors]);
  const box=document.getElementById('opts'); box.innerHTML='';
  opts.forEach(k=>{
    const b=document.createElement('button'); b.className='opt';
    b.innerHTML=`<span class="arrow">🔍</span> ${FCATS[k]}`;
    b.onclick=()=>answerF(k, ck, b); box.appendChild(b);
  });
  startTimer();
}

function answerF(key, ck, btn){
  stopTimer();
  fok = key===ck;
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  btn.classList.add(fok?'correct':'wrong');
  if(!fok) revealCorrect();
  let lost=false; const before=score;
  const pts1 = (cur.curve==='N') ? 20 : 10;   // 함정 문제 1단계는 배점을 높인다
  if(fok){ score += pts1; SFX.correct(); } else { streak=0; lost=loseLife(); SFX.wrong(); }
  const shown=gainShown(before, score);
  hud();
  const fb=document.getElementById('feedback');
  fb.className='feedback show ' + (fok?'good':'miss');
  const head = fok ? `✅ 정답! +${shown}점${mult()!==1?` (배율 ×${mult()})`:''}` : ('❌ 아쉬워요!' + (lost?' 목숨 -1':''));
  fb.innerHTML = `<div class="fb-title">${head}</div>이 사례의 핵심 요인은 <b>「${FCATS[ck]}」</b>! 그렇다면 이 요인은 그래프를 어떻게 움직일까요?`;
  logMark(fok);
  showNext();
}

/* ─── 2단계: 곡선 이동 ─── */
function renderQ1(){
  phase=2;
  document.getElementById('feedback').className='feedback';
  document.getElementById('next-btn').classList.remove('show');
  document.getElementById('retry-btn').classList.remove('show');
  document.getElementById('qtitle').textContent = window.MODE==='hard'
    ? '2단계 · 그래프의 A·B 중 어느 곡선이 움직일까?'
    : '2단계 · 그래프는 어떻게 될까?';
  let opts;
  if(window.MODE==='hard'){
    const lblToCurve = l => (LB.D===l ? 'D' : 'S');
    opts=[];
    ['A','B'].forEach(l=>{   // 항상 A 오른쪽 → A 왼쪽 → B 오른쪽 → B 왼쪽 순
      opts.push({key:lblToCurve(l)+'-R', html:`<span class="arrow bigab" style="color:${COL[l]}">${l} →</span> <b class="bigab" style="color:${COL[l]}">${l}</b> 곡선이 <b>오른쪽</b>으로 이동한다`});
      opts.push({key:lblToCurve(l)+'-L', html:`<span class="arrow bigab" style="color:${COL[l]}">← ${l}</span> <b class="bigab" style="color:${COL[l]}">${l}</b> 곡선이 <b>왼쪽</b>으로 이동한다`});
    });
    opts.push({key:'N', html:'<span class="arrow">✕</span> 곡선은 이동하지 않는다 <b>(수요량·공급량의 변화)</b>'});
  }else{
    opts=[
      {key:'D-R', html:'<span class="arrow d">D →</span> 수요 곡선이 <b>오른쪽</b>으로 이동한다'},
      {key:'D-L', html:'<span class="arrow d">← D</span> 수요 곡선이 <b>왼쪽</b>으로 이동한다'},
      {key:'S-R', html:'<span class="arrow s">S →</span> 공급 곡선이 <b>오른쪽</b>으로 이동한다'},
      {key:'S-L', html:'<span class="arrow s">← S</span> 공급 곡선이 <b>왼쪽</b>으로 이동한다'},
    ];
  }
  const box=document.getElementById('opts'); box.innerHTML='';
  // 2단계는 보기 순서를 항상 고정한다 (수요→ / 수요← / 공급→ / 공급←)
  opts.forEach((o,n)=>{
    const b=document.createElement('button'); b.className='opt';
    b.innerHTML = `<span class="optno">${n+1}</span> ` + o.html;
    b.onclick=()=>answerQ1(o.key, b); box.appendChild(b);
  });
  startTimer();
}

function answerQ1(key, btn){
  stopTimer();
  const correctKey = cur.curve==='N' ? 'N' : cur.curve+'-'+cur.dir;
  const ok = key===correctKey;
  sok = ok;
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  btn.classList.add(ok?'correct':'wrong');
  if(!ok) revealCorrect();
  const isTrap = cur.curve==='N';
  let gained=0, lost=false; const before=score;
  if(ok){
    gained = isTrap ? (10 + (fok?5:0)) : 10;
    score+=gained;
    isTrap ? SFX.perfect() : SFX.correct();
  }else{ streak=0; lost=loseLife(); SFX.wrong(); }
  hud();
  const fb=document.getElementById('feedback');
  fb.className='feedback show ' + (ok?'good':'miss');
  let head;
  if(ok){
    const bonus = (isTrap && fok) ? ' (두 단계 모두 정답 +5)' : '';
    head = `${isTrap?'🕵️ 함정 간파!':'✅ 정답!'} +${gainShown(before,score)}점${bonus}`;
  }else head='❌ 아쉬워요!' + (lost?' 목숨 -1':'');
  let identity='';
  if(window.MODE==='hard'){
    identity = `<div style="margin-bottom:6px">💡 오른쪽 아래로 내려가는 직선 <b class="bigab" style="color:${COL[LB.D]}">${LB.D}</b> = <b>수요 곡선</b>, 오른쪽 위로 올라가는 직선 <b class="bigab" style="color:${COL[LB.S]}">${LB.S}</b> = <b>공급 곡선</b>!</div>`;
  }
  fb.innerHTML = `<div class="fb-title">${head}</div>${identity}${cur.why}<br><span class="factor">${cur.factor}</span>`;
  logMark(ok);
  animateShift();
  showNext();
}

function matchOpt(html, key){
  const [c,d]=key.split('-');
  const dirWord = d==='R'?'오른쪽':'왼쪽';
  // 선택지 HTML에 태그가 섞여 있으므로 태그를 걷어내고 비교한다
  const txt = html.replace(/<[^>]*>/g,'');
  if(window.MODE==='hard') return txt.includes(LB[c]+' 곡선') && txt.includes(dirWord);
  const curveWord = c==='D'?'수요':'공급';
  return txt.includes(curveWord+' 곡선') && txt.includes(dirWord);
}

function animateShift(){
  if(cur.curve==='N') return; // 함정 문제: 곡선 이동 없음
  const g = document.getElementById(cur.curve==='D'?'demand-g':'supply-g');
  const ghost = document.getElementById('ghost');
  // 잔상: 원래 자리 점선 (현재 곡선 색을 그대로 사용)
  if(cur.curve==='D'){ ghost.setAttribute('x1',80); ghost.setAttribute('y1',70); ghost.setAttribute('x2',320); ghost.setAttribute('y2',250); }
  else{ ghost.setAttribute('x1',80); ghost.setAttribute('y1',250); ghost.setAttribute('x2',320); ghost.setAttribute('y2',70); }
  ghost.setAttribute('stroke', g.querySelector('line').getAttribute('stroke'));
  ghost.setAttribute('opacity','0.35');
  const {x,y,dx}=newEq(cur.curve,cur.dir);
  const label = document.getElementById(cur.curve==='D'?'d-label':'s-label');
  setTimeout(()=>{
    g.style.transform=`translateX(${dx}px)`;
    label.style.transform=`translateX(${dx}px)`;
    SFX.shift();
  },250);
  // 새 균형점
  const e1=document.getElementById('e1'), e1t=document.getElementById('e1t');
  e1.setAttribute('cx',x); e1.setAttribute('cy',y);
  e1t.setAttribute('x',x+10); e1t.setAttribute('y',y-8);
  setTimeout(()=>{ e1.setAttribute('opacity','1'); e1t.setAttribute('opacity','1'); },1200);
}

/* ─── 3단계: 가격·거래량 변동 ─── */
function renderQ2(){
  phase=3;
  document.getElementById('qtitle').textContent='3단계 · 새로운 균형에서 가격과 거래량은?';
  const opts=[
    {key:'UU', html:'가격 <b style="color:var(--up)">상승 ▲</b> · 거래량 <b style="color:var(--up)">증가 ▲</b>'},
    {key:'UD', html:'가격 <b style="color:var(--up)">상승 ▲</b> · 거래량 <b style="color:var(--down)">감소 ▼</b>'},
    {key:'DU', html:'가격 <b style="color:var(--down)">하락 ▼</b> · 거래량 <b style="color:var(--up)">증가 ▲</b>'},
    {key:'DD', html:'가격 <b style="color:var(--down)">하락 ▼</b> · 거래량 <b style="color:var(--down)">감소 ▼</b>'},
  ];
  const box=document.getElementById('opts'); box.innerHTML='';
  document.getElementById('feedback').className='feedback';
  document.getElementById('next-btn').classList.remove('show');
  document.getElementById('retry-btn').classList.remove('show');
  // 3단계도 보기 순서를 항상 고정한다 (상승▲증가▲ / 상승▲감소▼ / 하락▼증가▲ / 하락▼감소▼)
  opts.forEach((o,n)=>{
    const b=document.createElement('button'); b.className='opt';
    b.innerHTML = `<span class="optno">${n+1}</span> ` + o.html;
    b.onclick=()=>answerQ2(o.key,b); box.appendChild(b);
  });
  startTimer();
}

function q2Key(){
  if(cur.curve==='D') return cur.dir==='R' ? 'UU' : 'DD';
  return cur.dir==='R' ? 'DU' : 'UD';
}
const Q2WHY = {
  UU:'수요가 증가하면 균형점이 공급 곡선을 따라 오른쪽 위로 이동 → 가격 상승, 거래량 증가!',
  DD:'수요가 감소하면 균형점이 공급 곡선을 따라 왼쪽 아래로 이동 → 가격 하락, 거래량 감소!',
  DU:'공급이 증가하면 균형점이 수요 곡선을 따라 오른쪽 아래로 이동 → 가격 하락, 거래량 증가!',
  UD:'공급이 감소하면 균형점이 수요 곡선을 따라 왼쪽 위로 이동 → 가격 상승, 거래량 감소!',
};

function answerQ2(key, btn){
  stopTimer();
  const ck=q2Key(); const ok = key===ck;
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  btn.classList.add(ok?'correct':'wrong');
  if(!ok) revealCorrect();
  let gained=0;
  let lost=false; const before=score;
  if(ok){ gained = 10 + (fok&&sok?5:0); score+=gained; (fok&&sok)?SFX.perfect():SFX.correct(); }
  else { lost=loseLife(); SFX.wrong(); }
  streak = (ok&&fok&&sok) ? streak+1 : 0;
  let healed=false;
  if(streak>0 && streak%2===0 && lives<MAXLIVES){ lives++; healed=true; SFX.heal(); }
  hud();
  const fb=document.getElementById('feedback');
  fb.className='feedback show ' + (ok?'good':'miss');
  let head;
  if(ok){
    const extras=[];
    if(fok&&sok) extras.push('세 단계 모두 정답 +5');
    head = `✅ 정답! +${gainShown(before,score)}점${extras.length?` (${extras.join(', ')})`:''}`;
  }else head='❌ 아쉬워요!' + (lost?' 목숨 -1':'');
  const healMsg = healed ? `<div style="color:var(--heart);font-family:'Do Hyeon';margin-top:6px">❤ ${streak}문제 연속 완벽! 목숨을 하나 되찾았어요 (${'❤'.repeat(lives)})</div>` : '';
  fb.innerHTML=`<div class="fb-title">${head}</div>${Q2WHY[ck]}${healMsg}`;
  logMark(ok);
  showResultOnGraph(ck);
  showNext();
}

function optKeyOf(b){
  const t=b.textContent;
  return (t.includes('상승')?'U':'D') + (t.includes('증가')?'U':'D');
}

function showResultOnGraph(ck){
  const {x,y}=newEq(cur.curve,cur.dir);
  const set=(id,attrs)=>{const el=document.getElementById(id); for(const k in attrs) el.setAttribute(k,attrs[k]);};
  set('g-p0h',{x1:55,y1:160,x2:200,y2:160}); set('g-q0v',{x1:200,y1:285,x2:200,y2:160});
  set('g-p1h',{x1:55,y1:y,x2:x,y2:y});       set('g-q1v',{x1:x,y1:285,x2:x,y2:y});
  set('g-p0t',{x:50,y:164}); set('g-p1t',{x:50,y:y+4});
  set('g-q0t',{x:200,y:302}); set('g-q1t',{x:x,y:302});
  document.getElementById('guides').setAttribute('opacity','1');
  const bp=document.getElementById('badge-p'), bq=document.getElementById('badge-q');
  bp.textContent = ck[0]==='U'?'가격 상승 ▲':'가격 하락 ▼';
  bp.className = 'badge ' + (ck[0]==='U'?'up':'down');
  bq.textContent = ck[1]==='U'?'거래량 증가 ▲':'거래량 감소 ▼';
  bq.className = 'badge ' + (ck[1]==='U'?'up':'down');
  document.getElementById('badges').classList.add('show');
}

function nextStep(){
  if(dead){ endGame(true); return; }               // 목숨 소진 → 게임 오버
  if(phase===1){ renderQ1(); return; }             // 1단계 → 2단계(곡선 이동)
  if(phase===2 && cur.curve!=='N'){ renderQ2(); return; }  // 2단계 → 3단계(가격·거래량)
  round++;
  if(round>=ROUNDS){ endGame(false); return; }
  loadRound();
}

function endGame(gameover){
  stopTimer();
  gameover ? SFX.gameover() : SFX.clear();
  document.getElementById('timer-wrap').classList.remove('show');
  document.getElementById('retry-btn').classList.remove('show');
  document.getElementById('scr-game').classList.remove('active');
  document.getElementById('scr-end').classList.add('active');
  document.getElementById('final-score').textContent=disp(score);
  document.getElementById('final-max').textContent =
    ` 점 / ${maxScore()}점 · ${MULT_NAME[baseSec]}(×${mult().toFixed(1)})`;
  const pct = score / BASE_MAX;   // 등급은 만점 대비 비율로 판정
  const solved = gameover ? round : ROUNDS;
  let title,msg;
  if(gameover){
    title='💀 게임 오버';
    msg=`${MULT_NAME[baseSec]} 모드에서 목숨을 모두 잃었어요. ${ROUNDS}문제 중 ${solved+1}번째 문제에서 멈췄습니다. 아래 오답을 확인하고 다시 도전해 봐요!`;
  }else{
    const r = rankOf(pct);
    title = r.t;
    const nudge = (pct>=0.8 && baseSec===30) ? ' 이제 PRO(20초)에 도전해 볼까요?'
                : (pct>=0.8 && baseSec===20) ? ' 다음은 MASTER(12초)가 기다립니다!'
                : '';
    if(flawless){
      title = '🌟 ' + r.t + ' · 퍼펙트!';
      msg = '한 문제도 틀리지 않고 완주했어요! 모든 사례의 요인과 곡선을 완벽하게 읽어냈습니다.' + nudge;
    }else{
      msg = (pct>=0.8 ? `목숨 ${lives}개를 남기고 완주! ` : '') + r.m + nudge;
    }
  }
  document.getElementById('final-title').textContent=title;
  document.getElementById('final-msg').textContent=msg;
  const rv=document.getElementById('review');
  const mark=(v,label)=> v===undefined ? '' : (v?`<span class="ok">${label} ○</span>`:`<span class="no">${label} ✕</span>`);
  rv.innerHTML = log.map(l=>
    `<div class="rv">${l.round}. [${l.market}] ${mark(l.f,'①요인')}${mark(l.s,'②이동')}${mark(l.p,'③가격')}</div>`
  ).join('');
}
